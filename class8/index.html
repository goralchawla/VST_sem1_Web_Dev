<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            width: 300px;
            height: 300px;
            background-color: red;
            transition: 2s;

        #box:hover{
            background-color: green;
            border-radius: 50%;

        }
    </style>
</head>

    <div id="box">


    </div>
