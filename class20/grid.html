<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height: 90vh;
            border: 2px solid;
            display: grid;
            grid-template-columns: 300px 300px 300px 300px;
            grid-template-rows: 300px 300px 300;

        }
        .one{
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one" class="one">1</div>
        <div id="two" class="one">2</div>
        <div id="three" class="one">3</div>
        <div id="four" class="one">4</div>
        <div id="five" class="one">5</div>
        <div id="six" class="one">6</div>
        <div id="seven" class="one">7</div>
        <div id="eight" class="one">8</div>
        <div id="nine" class="one">9</div>
        <div id="ten" class="one">10</div>
        <div id="eleven" class="one">11</div>
        <div id="twelve" class="one">12</div>
        <div id="thirteen" class="one">13</div>
        <div id="fourteen" class="one">14</div>
        <div id="fifteen" class="one">15</div>
    </div>
</body>
</html>
