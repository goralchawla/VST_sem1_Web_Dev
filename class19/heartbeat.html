<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        div{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img{
            width: 300px;
            height: 200px;
            margin: 10px auto;
            animation-name: anime;
            animation-duration: 0.5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-out;
        }
        @keyframes anime {
            0%{
                transform: scale(1);
                opacity: 0.3;
            }
            85%{
                transform: scale(1.4);
            }
            95%{
                transform: scale(1.7);
            }
        }
    </style>
</head>
<body>
    <div>
        <img src="heart Background Removed.png">
    </div>
</body>
</html>
