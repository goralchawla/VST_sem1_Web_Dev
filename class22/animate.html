<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .parent{
            background-color: white;
            height: 200px;
            width: 350px;
            position: absolute;
            top: 300px;
            left: 1160px;
            transition: 1s;
            transition-delay: 0.5s;
        }
        .one{
            width: 100%;
            height: 25%;
            font-size: 20px;
            letter-spacing: 2px;
            padding-left: 10px;

        }
        #main{
            height: 95vh;
            width: 98vw;
            overflow: hidden;
        }

        .parent:hover{
            transform: translateX(-200px);
        }

    
    </style>
</head>
<body>
    <div id="main">
    <div class="parent">
        <div class="one">🛞 Book a test Drive</div>
        <div class="one">😁 Build Your own</div>
        <div class="one">🥪 View prices</div>
        <div class="one">🎡 Reserve Online</div>
    </div>
    </div>
</body>
</html>
