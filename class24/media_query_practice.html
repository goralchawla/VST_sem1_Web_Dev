<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            height: 10vh;
            width: 100vw;
            background-color: rgb(180, 180, 180);
            display: flex;
            justify-content: space-between;
        }
        #g1{
            margin-left: 10px;
            display: flex;
            width: 500px;
            height: 100%;
            justify-content: space-between;
            align-items: center;
        }
        #g2{
            display: flex;
            width: 300px;
            justify-content: space-between;
            margin-right: 10px;
            height: 100%;
            align-items: center;
        }
        button{
            padding: 10px;
            width: 100px;
            background-color: none;
            border: 2px solid green;
        }
        button:hover{
            background-color: green;
        }

        @media screen and (max-width:500px){
            nav{
                height: auto;
                flex-direction: column;
                align-items: center;
            }
            #g1{
                flex-direction: column;
                margin-left: 0;
                position: relative;
                right: 200px;
                margin-top: 10px;
                margin-left: 70px;
                margin-bottom: 10px;
            }
            #g2{
                width: 100%;
                justify-content: space-around;
            }
            textarea{
                width: 60vw;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div id="g1">
            <div id="div1">Navbar</div>
            <div id="div2">Home</div>
            <div id="div3">Link</div>
            <div id="div4">DropDown</div>
            <div id="div5">Disabled</div>
        </div>
        <div id="g2">
            <div><textarea>Search</textarea></div>
            <div><button>Search</button></div>
        </div>
    </nav>
</body>
</html>
