<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 400px;
            width: 600px;
            background-color: purple;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            padding-top: 50px;
        }
     

        #left{
            height: 250px;
            width: 45%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }
        #c1{
            width: 100%;
            height: 50px;
            background-color: pink;
        }
        #c2{
            width: 100%;
            height: 110px;
            background-color: yellow;
        }
        #c3{
            width: 47%;
            height: 180px;
            background-color: skyblue;
        }
        #c4{
            width: 100%;
            height: 60px;
            background-color: red;
        }
        #p{
            display: flex;
            flex-direction: column;
            height: 180px;
            width: 47%;
            justify-content: space-between;
        }
        #right{
            height: 250px;
            width: 45%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }
        #r1{
            height: 160px;
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

        }
        #r2{
            height: 160px;
            width: 45%;
            display: flex;
            justify-content: space-between;
            flex-direction: column;
        }
        #p1{
            background-color: red;
            height: 50px;
            width: 100%;
        }
        #p2{
            background-color: rgb(50, 130, 199);
            height: 30px;
            width: 100%;
        }
        #p3{
            background-color: rgb(190, 219, 27);
            height: 60px;
            width: 100%;
        }
        #p4{
            background-color: rgb(50, 130, 199);
            height: 60px;
            width: 100%;
        }
        #p5{
            background-color: rgb(190, 219, 27);
            height: 50px;
            width: 100%;
        }
        #p6{
            background-color: red;
            height: 30px;
            width: 100%;
        }
        #r3{
            width: 100%;
            height: 80px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="left">
            <div id="c1"></div>
            <div id="p">
            <div id="c2"></div>
            <div id="c4"></div>
            </div>
            <div id="c3"></div>
        </div>
        <div id="right">
            <div id="r1">
                <div id="p1"></div>
                <div id="p2"></div>
                <div id="p3"></div>
            </div>
            <div id="r2">
                <div id="p4"></div>
                <div id="p5"></div>
                <div id="p6"></div>
            </div>
            <div id="r3"></div>
        </div>
    </div>
</body>
</html>
