<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2" cellspacing="0">
        <tr>
            <th>Information</th>
            <th>Value</th>
        </tr>

        <tr>
            <td>Name</td>
            <td id="name"></td>
        </tr>

        <tr>
            <td>Gender</td>
            <td id="gender"></td>
        </tr>

        <tr>
            <td>Age</td>
            <td id="age" name="age"></td>
        </tr>

        <tr>
            <td>School Name</td>
            <td id="sc_name"></td>
        </tr>
    </table>

<script>

    const data = new URLSearchParams(window.location.search);

    document.getElementById("name").textContent = data.get("name");
    document.getElementById("gender").textContent = data.get("gender");
    document.getElementById("age").textContent = data.get("age");
    document.getElementById("sc_name").textContent = data.get("sc_name");

</script>
</body>
</html>
