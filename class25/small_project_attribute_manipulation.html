<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img height="400px" src=""/>
    <script>
        let arr=["https://images.unsplash.com/photo-1790595578718-8acaa48ba0f3?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","https://plus.unsplash.com/premium_photo-1792775490136-d4493a7643b2?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","https://plus.unsplash.com/premium_photo-1792947197774-ae0a2c97890b?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D","https://images.unsplash.com/photo-1793165591665-6e63e3a7fd29?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"]
        let img=document.querySelector("img")
        let n=0
        setInterval(()=>{
            img.setAttribute("src",arr[n])
            n=(n+1)%arr.length
        },1500)
    </script>
</body>
</html>
