<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        #body{
            height: 100vh;
            width: 100vw;
            background-color: rgb(11, 175, 120);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #main{
            border-radius: 15px;
            padding: 25px;
            background-color: cyan;
            row-gap: 20px;
        }
        #heading{
            margin-bottom: 20px;
        }
        #add{
            padding: 10px;
            background-color: blue;
            color: white;
            border-radius: 15px;
            border: none;
        }
        #inp{
            padding: 7px;
        }
        #list{
            gap: 15px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            list-style: none;
            
        }
        li{
            background-color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }
        .deletebtn{
            background-color: red;
        }
       

    </style>
</head>
<body>
    <div id="body">
    <div id="main">
        <h2 id="heading">My-todo-list</h2>
        <input id="inp"/>
        <button id="add">Add Task</button>
        <br>
        <ul id="list">

        </ul>
    </div>
    
    </div>
    <script src="./todo.js"></script>
</body>
</html>
